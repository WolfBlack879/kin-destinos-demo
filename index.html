<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tótem Turístico Pucón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="stage">
  <div class="stagebar">
    <div class="brand"><b>Plataforma de información turística · Prototipo</b><span>Kin Outdoor · Postulación Start-Up Chile Build (BIG 13)</span></div>
    <div class="daymode" role="group" aria-label="Modo de pantalla"><span>Pantalla:</span>
      <button id="dm-auto" data-dm="auto" aria-pressed="true">Auto</button>
      <button id="dm-day" data-dm="day" aria-pressed="false">Día</button>
      <button id="dm-night" data-dm="night" aria-pressed="false">Noche</button>
      <span id="dm-info"></span></div>
    <div class="tabs" role="group" aria-label="Vista">
      <button id="tab-totem" data-view="totem" aria-pressed="true">Tótem</button>
      <button id="tab-phone" data-view="phone" aria-pressed="false">Teléfono</button>
      <button id="tab-merchant" data-view="merchant" aria-pressed="false">Panel comercio</button>
      <button id="tab-analytics" data-view="analytics" aria-pressed="false">Analítica destino</button>
    </div>
  </div>
  <div class="stagebody" id="stagebody"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/textos.js"></script>
<script src="js/tiempo.js"></script>
<script src="js/panel.js"></script>
<script src="js/analitica.js"></script>
<script src="js/mapa.js"></script>
<script src="js/clima.js"></script>
<script src="js/app.js"></script>
</body>
</html>
